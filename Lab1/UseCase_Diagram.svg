  <text x="670" y="296" font-size="12.5" text-anchor="middle" fill="#1a1a2e">Process Renewal</text>
  <text x="670" y="311" font-size="12.5" text-anchor="middle" fill="#1a1a2e">&amp; Payment (FR-004)</text>
  <ellipse cx="670" cy="420" rx="130" ry="34" fill="#ffe0df" stroke="#7a1a1a" stroke-width="1.5"/>
  <text x="670" y="416" font-size="12.5" text-anchor="middle" fill="#5c0f0f">Send Reminder</text>
  <text x="670" y="431" font-size="12.5" text-anchor="middle" fill="#5c0f0f">Notification (FR-004)</text>
