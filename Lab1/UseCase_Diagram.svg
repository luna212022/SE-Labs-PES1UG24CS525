  <text x="400" y="496" font-size="12.5" text-anchor="middle" fill="#1a1a2e">Generate Fulfillment</text>
  <text x="400" y="511" font-size="12.5" text-anchor="middle" fill="#1a1a2e">Manifest (FR-005)</text>
  <g stroke="#1a1a2e" stroke-width="1.5">
    <line x1="122" y1="190" x2="280" y2="140"/>
    <line x1="122" y1="205" x2="280" y2="228"/>
    <line x1="122" y1="220" x2="280" y2="322"/>
    <line x1="122" y1="450" x2="260" y2="495"/>
  </g>
  <line x1="885" y1="300" x2="800" y2="300" stroke="#1a1a2e" stroke-width="1.5"/>
  <defs>
    <marker id="openArrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#4a3800" stroke-width="1.5"/>
    </marker>
    <marker id="openArrowRed" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#7a1a1a" stroke-width="1.5"/>
    </marker>
  </defs>
  <line x1="500" y1="145" x2="565" y2="175" stroke="#4a3800" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="500" y="150" font-size="11" font-style="italic" fill="#4a3800">&#171;include&#187;</text>
  <line x1="500" y1="225" x2="565" y2="190" stroke="#4a3800" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="500" y="220" font-size="11" font-style="italic" fill="#4a3800">&#171;include&#187;</text>
  <line x1="670" y1="386" x2="670" y2="334" stroke="#7a1a1a" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#openArrowRed)"/>
  <text x="700" y="365" font-size="11" font-style="italic" fill="#7a1a1a">&#171;extend&#187;</text>
  <line x1="118" y1="445" x2="260" y2="500" stroke="#1a1a2e" stroke-width="1.5"/>
  <g font-size="11" fill="#333">
    <rect x="240" y="600" width="14" height="10" fill="#dbe7ff" stroke="#2b3a55"/>
    <text x="260" y="609">Base use case</text>
    <rect x="380" y="600" width="14" height="10" fill="#fff3cf" stroke="#7a5c00"/>
    <text x="400" y="609">Included use case</text>
    <rect x="540" y="600" width="14" height="10" fill="#ffe0df" stroke="#7a1a1a"/>
    <text x="560" y="609">Extending use case</text>
  </g>
</svg>
