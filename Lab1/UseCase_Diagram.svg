<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>
  <text x="500" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Use-Case Diagram: Customizable Subscription Box Scheduler</text>
  <rect x="220" y="60" width="620" height="560" rx="8" fill="#f7f9fc" stroke="#2b3a55" stroke-width="2"/>
  <text x="530" y="85" font-size="15" font-weight="bold" text-anchor="middle" fill="#2b3a55">Subscription Box Scheduler</text>
  <g stroke="#1a1a2e" stroke-width="2" fill="none">
    <circle cx="90" cy="180" r="14" fill="#ffffff"/>
    <line x1="90" y1="194" x2="90" y2="240"/>
    <line x1="60" y1="212" x2="120" y2="212"/>
    <line x1="90" y1="240" x2="65" y2="275"/>
    <line x1="90" y1="240" x2="115" y2="275"/>
  </g>
  <text x="90" y="295" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Subscriber</text>
  <g stroke="#1a1a2e" stroke-width="2" fill="none">
    <circle cx="90" cy="440" r="14" fill="#ffffff"/>
    <line x1="90" y1="454" x2="90" y2="500"/>
    <line x1="60" y1="472" x2="120" y2="472"/>
    <line x1="90" y1="500" x2="65" y2="535"/>
    <line x1="90" y1="500" x2="115" y2="535"/>
  </g>
  <text x="90" y="555" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Fulfillment Lead</text>
  <g stroke="#1a1a2e" stroke-width="2" fill="none">
    <circle cx="915" cy="300" r="14" fill="#ffffff"/>
    <line x1="915" y1="314" x2="915" y2="360"/>
    <line x1="885" y1="332" x2="945" y2="332"/>
    <line x1="915" y1="360" x2="890" y2="395"/>
    <line x1="915" y1="360" x2="940" y2="395"/>
  </g>
  <text x="915" y="415" font-size="12" text-anchor="middle" fill="#1a1a2e">Payment Gateway</text>
  <text x="915" y="430" font-size="10" font-style="italic" text-anchor="middle" fill="#555">(external system)</text>
  <ellipse cx="400" cy="130" rx="120" ry="34" fill="#dbe7ff" stroke="#2b3a55" stroke-width="1.5"/>
  <text x="400" y="126" font-size="12.5" text-anchor="middle" fill="#1a1a2e">Customize Box</text>
  <text x="400" y="141" font-size="12.5" text-anchor="middle" fill="#1a1a2e">Selection (FR-001)</text>
  <ellipse cx="400" cy="230" rx="120" ry="34" fill="#dbe7ff" stroke="#2b3a55" stroke-width="1.5"/>
  <text x="400" y="226" font-size="12.5" text-anchor="middle" fill="#1a1a2e">Pause / Skip</text>
  <text x="400" y="241" font-size="12.5" text-anchor="middle" fill="#1a1a2e">Delivery (FR-002)</text>
  <ellipse cx="400" cy="330" rx="120" ry="34" fill="#dbe7ff" stroke="#2b3a55" stroke-width="1.5"/>
  <text x="400" y="326" font-size="12.5" text-anchor="middle" fill="#1a1a2e">Manage Preference</text>
  <text x="400" y="341" font-size="12.5" text-anchor="middle" fill="#1a1a2e">Tags (FR-003)</text>
  <ellipse cx="670" cy="180" rx="130" ry="34" fill="#fff3cf" stroke="#7a5c00" stroke-width="1.5"/>
  <text x="670" y="176" font-size="12.5" text-anchor="middle" fill="#4a3800">Validate Customization</text>
  <text x="670" y="191" font-size="12.5" text-anchor="middle" fill="#4a3800">Window</text>
